name: Publish

# A product's release workflow sends `repository_dispatch` (type `release`)
# right after it publishes. The daily run catches anything that was missed,
# and is how a deleted release drops out of the index.
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [release]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# One index rebuild at a time, so two products releasing together can't race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install apt-ftparchive
        run: sudo apt-get update && sudo apt-get install -y apt-utils

      - name: Build repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build.sh

      - name: Sign
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: ./scripts/sign.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
